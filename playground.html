<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Play with Friends — standalone UI playground.
      One self-contained file: open it by double-clicking. No server, no build,
      no network requests, no storage (settings last until the tab is closed or reloaded).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfa" />
    <title>Play with Friends — Playground</title>
    <style>
      /* ── Tokens ───────────────────────────────────────────────────
         Colour defaults for first paint. The script below overwrites them
         with a palette derived from the user's choices and checked for
         WCAG 2.2 AA contrast. */
      :root {
        --color-bg: #fbfbfa;
        --color-surface: #fdfdfd;
        --color-text: #18181b;
        --color-text-muted: #5f5f66;
        --color-border: #8a8a8f;
        --color-border-subtle: #e0e0e0;
        --color-accent: #6b4eff;
        --color-on-accent: #ffffff;
        --color-accent-strong: #6b4eff;
        --color-scrim: rgb(15 15 20 / 0.35);

        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.25rem;
        --space-6: 1.5rem;
        --space-8: 2rem;

        --radius-md: 0.75rem;
        --radius-lg: 1.25rem;
        --tap-min: 2.75rem; /* 44px minimum touch target */
        --duration: 200ms;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);

        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);

        font-family: 'Inter var', Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
          sans-serif;
        line-height: 1.5;
        color: var(--color-text);
        background: var(--color-bg);
        color-scheme: light dark;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --color-bg: #121214;
          --color-surface: #1e1e20;
          --color-text: #f4f4f5;
          --color-text-muted: #a8a8ad;
          --color-border: #6e6e73;
          --color-border-subtle: #303033;
          --color-accent-strong: #8a74ff;
          --color-scrim: rgb(0 0 0 / 0.6);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        :root {
          --duration: 0ms;
        }
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* ── Base ────────────────────────────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        overflow-x: clip; /* never scroll sideways */
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--color-bg);
        -webkit-tap-highlight-color: transparent;
      }

      button,
      input,
      label {
        font: inherit;
        color: inherit;
        touch-action: manipulation; /* taps respond immediately */
      }

      :focus-visible {
        outline: 3px solid var(--color-accent-strong);
        outline-offset: 2px;
      }

      html:has(dialog[open]) {
        overflow: hidden; /* page behind the menu doesn't scroll */
      }

      [hidden] {
        display: none !important;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      /* ── Canvas ──────────────────────────────────────────────────── */
      .canvas {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh; /* follows the mobile address bar */
        background: var(--color-bg);
        color: var(--color-text);
        transition:
          background-color var(--duration) var(--ease),
          color var(--duration) var(--ease);
      }

      /* The canvas centres its content in whatever space is left after the
         menu button. If the content is taller than the screen, the page
         scrolls vertically (auto margins never clip the top). */
      .canvas main {
        flex: 1 0 auto;
        display: flex;
        padding: calc(var(--tap-min) + var(--space-6) + var(--safe-top)) max(var(--space-4), var(--safe-right))
          max(var(--space-6), calc(var(--safe-bottom) + var(--space-4))) max(var(--space-4), var(--safe-left));
      }

      /* ── Game selection hero ─────────────────────────────────────
         Just a heading and the seven buttons, directly on the page
         background (no enclosing card). */
      .game-hero {
        margin: auto;
        width: 100%;
        max-width: 26rem;
        color: var(--color-text);
        text-align: center;
      }

      .game-hero h1 {
        margin: 0 0 clamp(var(--space-6), 1rem + 2vw, 2.5rem);
        font-size: clamp(1.75rem, 1.3rem + 2vw, 2.5rem);
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.02em;
        overflow-wrap: break-word;
      }

      .game-list {
        display: grid;
        /* Room for each button's 4px offset shadow and its bounce. */
        gap: clamp(1rem, 0.85rem + 0.6vw, 1.25rem);
        margin: 0;
        padding: 0;
        list-style: none;
      }

      /* ── Game buttons ────────────────────────────────────────────
         Adapted from the reference "styled button": a light face, thick
         dark outline, an inner bevel on the bottom-right edge, and a hard
         offset shadow that makes it look raised. Hovering presses it down
         halfway; pressing it sinks it fully (shadow gone) and fills it.
         Colours come from the theme, so it works in light, dark and any
         custom colours:
           face   = panel colour        (reference #f0f0f0)
           ink    = text colour         (reference #333) — outline, shadow, label
           bevel  = face mixed with ink (reference #ccc)
           press  = accent fill with readable text (reference inverts to black) */
      .game-option {
        --btn-face: var(--color-surface);
        --btn-ink: var(--color-text);
        --btn-bevel: color-mix(in srgb, var(--btn-face) 78%, var(--btn-ink));
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 3.5rem;
        padding: 0.8rem 1.5rem;
        border: 3px solid var(--btn-ink);
        border-radius: 10px;
        background-color: var(--btn-face);
        color: var(--btn-ink);
        box-shadow:
          inset -4px -4px 0 var(--btn-bevel),
          4px 4px 0 var(--btn-ink);
        font-size: clamp(1.0625rem, 1rem + 0.35vw, 1.25rem);
        font-weight: 650;
        line-height: 1.25;
        text-align: center;
        overflow-wrap: anywhere;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        /* The bounce animates `transform`; hover/press use `translate`, so
           the two combine instead of fighting. */
        transition:
          box-shadow 0.3s ease,
          background-color 0.3s ease,
          border-color 0.3s ease,
          color 0.3s ease,
          translate 0.3s ease;
      }

      /* Hover (real pointers only, so it never "sticks" after a tap). */
      @media (hover: hover) {
        .game-option:hover {
          box-shadow:
            inset -2px -2px 0 var(--btn-bevel),
            2px 2px 0 var(--btn-ink);
          translate: 2px 2px;
        }
      }

      .game-option:focus-visible {
        outline: 3px solid var(--color-accent-strong);
        outline-offset: 5px;
      }

      /* Pressed: sinks into its shadow and fills with the accent colour.
         Faster than the other transitions, so a tap feels immediate. */
      .game-option:active {
        background-color: var(--color-accent);
        color: var(--color-on-accent);
        border-color: var(--btn-ink);
        box-shadow: none;
        translate: 4px 4px;
        transition-duration: 0.08s;
      }

      /* The reference's bounce, played as a staggered "hello" when the page
         opens: two bounces each (4 s), then the buttons stay still. A
         permanent bounce would make seven moving targets hard to tap and
         breaks WCAG 2.2.2 (moving content must stop within 5 s). */
      @media (prefers-reduced-motion: no-preference) {
        .game-hero:not([data-settled]) .game-option {
          animation: game-bounce 2s ease calc(var(--i, 0) * 90ms) 2 both;
        }
      }

      .game-list li:nth-child(1) { --i: 0; }
      .game-list li:nth-child(2) { --i: 1; }
      .game-list li:nth-child(3) { --i: 2; }
      .game-list li:nth-child(4) { --i: 3; }
      .game-list li:nth-child(5) { --i: 4; }
      .game-list li:nth-child(6) { --i: 5; }
      .game-list li:nth-child(7) { --i: 6; }

      @keyframes game-bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-10px);
        }
        60% {
          transform: translateY(-5px);
        }
      }

      /* Short landscape screens (phones on their side): two columns so all
         seven games fit with little or no scrolling. The last one is centred. */
      @media (orientation: landscape) and (max-height: 30rem) and (min-width: 36rem) {
        .canvas main {
          padding-top: max(var(--space-4), var(--safe-top));
          padding-left: max(calc(var(--tap-min) + var(--space-6)), var(--safe-left));
        }

        .game-hero {
          max-width: 40rem;
        }

        .game-hero h1 {
          margin-bottom: var(--space-4);
          font-size: 1.5rem;
        }

        .game-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: var(--space-3) var(--space-4);
        }

        .game-list li:last-child:nth-child(odd) {
          grid-column: 1 / -1;
          justify-self: center;
          width: calc(50% - var(--space-4) / 2);
        }

        .game-option {
          min-height: 3rem;
          padding-block: 0.5rem;
          font-size: 1.0625rem;
        }
      }

      /* Windows High Contrast: keep the outline, drop the decorative shadows. */
      @media (forced-colors: active) {
        .game-option {
          border: 3px solid ButtonText;
          box-shadow: none;
        }
      }

      /* ── Truth or Dare screen ────────────────────────────────────── */
      .tod {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        margin: auto;
        gap: clamp(var(--space-4), 2.5vh, var(--space-6));
      }

      /* Back: just the left arrow, beside the gear, same height and spacing.
         Like the gear, it has no visible container: the button is an
         invisible, square 44×44 px hit area, with the same focus ring. */
      .back-button {
        position: fixed;
        top: max(var(--space-3), calc(var(--safe-top) + var(--space-2)));
        left: max(calc(var(--space-3) + var(--tap-min) + var(--space-2)), calc(var(--safe-left) + var(--space-2) + var(--tap-min) + var(--space-2)));
        z-index: 10;
        display: grid;
        place-items: center;
        width: var(--tap-min);
        height: var(--tap-min);
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        color: var(--color-text);
        cursor: pointer;
        transition:
          color var(--duration) var(--ease),
          transform var(--duration) var(--ease);
      }

      /* Hover / keyboard focus: the arrow takes the accent colour and nudges
         left, hinting where it goes. Only `transform` moves (GPU-friendly). */
      .back-icon {
        transition: transform 200ms var(--ease);
      }

      @media (hover: hover) {
        .back-button:hover {
          color: var(--color-accent-strong);
        }

        .back-button:hover .back-icon {
          transform: translateX(-3px);
        }
      }

      .back-button:focus-visible {
        color: var(--color-accent-strong);
      }

      /* Keyboard focus ring for the gear and the arrow, drawn as an overlay
         that ignores the pointer. (Rounding the button itself would make its
         corners unclickable; an overlay keeps the full square hit area.) */
      .settings-button:focus-visible,
      .back-button:focus-visible {
        outline: none;
      }

      .settings-button:focus-visible::after,
      .back-button:focus-visible::after {
        content: '';
        position: absolute;
        inset: -5px;
        border: 3px solid var(--color-accent-strong);
        border-radius: calc(var(--radius-md) + 5px);
        pointer-events: none;
      }

      @media (forced-colors: active) {
        .settings-button:focus-visible::after,
        .back-button:focus-visible::after {
          border-color: Highlight;
        }
      }

      .back-button:focus-visible .back-icon {
        transform: translateX(-3px);
      }

      .back-button:active {
        transform: scale(0.92);
      }

      @media (prefers-reduced-motion: reduce) {
        .back-button .back-icon,
        .back-button:hover .back-icon,
        .back-button:focus-visible .back-icon {
          transform: none;
          transition: none;
        }
      }

      @media (min-width: 64rem) {
        .back-button {
          top: max(var(--space-4), calc(var(--safe-top) + var(--space-2)));
          left: max(calc(var(--space-4) + var(--tap-min) + var(--space-2)), calc(var(--safe-left) + var(--space-2) + var(--tap-min) + var(--space-2)));
        }
      }

      .tod h1 {
        margin: 0;
        font-size: clamp(1.375rem, 1.1rem + 1.2vw, 1.875rem);
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.02em;
        text-align: center;
      }

      .flip-cards {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(var(--space-4), 2.5vh, var(--space-6));
        width: 100%;
      }

      /* One flip card. Based on the reference: perspective on the card,
         preserve-3d on the inner layer, two faces with hidden backs, and a
         180° turn around the vertical axis. It's a real <button>, so it
         works with touch, mouse and keyboard (Enter / Space). */
      .flip-card {
        /* Two cards stacked must fit the visible height on most screens. */
        --card-h: clamp(9rem, calc((100dvh - 15rem) / 2), 17rem);
        position: relative;
        display: block;
        width: min(100%, 26rem);
        height: var(--card-h);
        padding: 0;
        border: 0;
        border-radius: var(--radius-lg);
        background: none;
        color: inherit;
        cursor: pointer;
        perspective: 1000px;
        -webkit-tap-highlight-color: transparent;
        container-type: size;
      }

      .flip-card:focus-visible {
        outline: 3px solid var(--color-accent-strong);
        outline-offset: 4px;
      }

      .flip-inner {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transition: transform 600ms cubic-bezier(0.3, 0.7, 0.2, 1);
      }

      .flip-card[aria-pressed='true'] .flip-inner {
        transform: rotateY(180deg);
      }

      @media (hover: hover) and (prefers-reduced-motion: no-preference) {
        .flip-card:hover .flip-inner {
          translate: 0 -2px;
        }
      }

      .flip-card:active .flip-inner {
        scale: 0.985;
      }

      .face {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        padding: var(--space-4);
        border: 1px solid transparent;
        border-radius: var(--radius-lg);
        text-align: center;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        transition:
          background-color var(--duration) var(--ease),
          color var(--duration) var(--ease),
          border-color var(--duration) var(--ease);
      }

      .face-back {
        transform: rotateY(180deg);
      }

      .face-word {
        font-size: clamp(2rem, 22cqh, 3.75rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0.08em;
      }

      .face-label {
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .face-text {
        max-width: 18rem;
        font-size: clamp(1rem, 0.9rem + 1cqh, 1.25rem);
        font-weight: 550;
        line-height: 1.35;
      }

      .face-hint {
        font-size: 0.8125rem;
        opacity: 0.85;
      }

      /* Truth: filled with the accent colour. */
      .truth .face-front {
        background: var(--color-accent);
        color: var(--color-on-accent);
      }

      /* Dare: the inverse of the page (dark card in light themes, light card
         in dark themes) so it is clearly different from Truth with any accent. */
      .dare .face-front {
        background: var(--color-text);
        color: var(--color-bg);
      }

      /* Backs: quiet surface with a coloured edge matching the front. */
      .face-back {
        background: var(--color-surface);
        color: var(--color-text);
        border-width: 2px;
      }

      .truth .face-back {
        border-color: var(--color-accent-strong);
      }

      .dare .face-back {
        border-color: var(--color-text);
      }

      .face-back .face-label {
        color: var(--color-text-muted);
      }

      /* The Truth or Dare screen always keeps room above it for the fixed
         menu and Back buttons (the landscape game-list layout trims it). */
      .canvas main:has(.tod:not([hidden])) {
        padding-top: calc(var(--tap-min) + var(--space-5) + var(--safe-top));
        padding-left: max(var(--space-4), var(--safe-left));
      }

      /* Short landscape screens: tighter spacing, smaller title, so both
         stacked cards fit without scrolling where possible. */
      @media (orientation: landscape) and (max-height: 30rem) {
        .tod {
          gap: var(--space-3);
        }

        .tod h1 {
          font-size: 1.125rem;
        }

        .flip-cards {
          gap: var(--space-3);
        }

        .flip-card {
          --card-h: max(7.5rem, calc((100dvh - 9.5rem) / 2));
          width: min(100%, 30rem);
        }

        .face-hint {
          display: none;
        }
      }

      /* Reduced motion: the card changes face instantly instead of turning. */
      @media (prefers-reduced-motion: reduce) {
        .flip-inner {
          transition: none;
        }
      }

      @media (forced-colors: active) {
        .face {
          border: 2px solid CanvasText;
        }
      }

      /* ── Settings button (gear) ───────────────────────────────────────────────── */
      .settings-button {
        position: fixed;
        top: max(var(--space-3), calc(var(--safe-top) + var(--space-2)));
        left: max(var(--space-3), calc(var(--safe-left) + var(--space-2)));
        z-index: 10;
        display: grid;
        place-items: center;
        width: var(--tap-min);
        height: var(--tap-min);
        /* No visible container: just the gear on the page. The button keeps
           its full 44×44 px as an invisible, square hit area; the keyboard
           focus ring is drawn separately (see below). */
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        color: var(--color-text);
        cursor: pointer;
        transition:
          color var(--duration) var(--ease),
          transform var(--duration) var(--ease);
      }

      /* Hover: the gear takes the accent colour (and turns, below). */
      @media (hover: hover) {
        .settings-button:hover {
          color: var(--color-accent-strong);
        }
      }

      .settings-button:focus-visible {
        color: var(--color-accent-strong);
      }

      .settings-button:active {
        transform: scale(0.92);
      }

      /* Gear: still when idle; turns 45° on hover or keyboard focus. Only the
         compositor-friendly `transform` animates (no layout or paint work),
         and will-change keeps it on its own GPU layer for smooth 60 fps. */
      .settings-icon {
        transition: transform 300ms var(--ease);
        will-change: transform;
      }

      @media (hover: hover) {
        .settings-button:hover .settings-icon {
          transform: rotate(45deg);
        }
      }

      .settings-button:focus-visible .settings-icon {
        transform: rotate(45deg);
      }

      /* Reduced motion: no turning at all (not even an instant jump). */
      @media (prefers-reduced-motion: reduce) {
        .settings-button .settings-icon,
        .settings-button:hover .settings-icon,
        .settings-button:focus-visible .settings-icon {
          transform: none;
          transition: none;
        }
      }

      @media (min-width: 64rem) {
        .settings-button {
          top: max(var(--space-4), calc(var(--safe-top) + var(--space-2)));
          left: max(var(--space-4), calc(var(--safe-left) + var(--space-2)));
        }
      }

      /* ── Panel: side drawer by default (tablets, landscape phones) ── */
      .panel {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(22rem, calc(100vw - 3rem));
        height: 100dvh;
        max-width: none;
        max-height: none;
        margin: 0;
        padding: 0;
        border: 0;
        border-right: 1px solid var(--color-border-subtle);
        background: var(--color-surface);
        color: var(--color-text);
        overflow: hidden;
        overscroll-behavior: contain;
      }

      .panel::backdrop {
        background: var(--color-scrim);
      }

      .panel-inner {
        display: flex;
        flex-direction: column;
        height: 100%;
        max-height: inherit;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);
        padding: max(var(--space-3), var(--safe-top)) var(--space-3) var(--space-2)
          max(var(--space-5), var(--safe-left));
      }

      .panel-title {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .icon-button {
        display: grid;
        place-items: center;
        width: var(--tap-min);
        height: var(--tap-min);
        padding: 0;
        border: 0;
        border-radius: var(--radius-md);
        background: transparent;
        color: var(--color-text-muted);
        cursor: pointer;
      }

      .icon-button:hover {
        background: var(--color-border-subtle);
        color: var(--color-text);
      }

      .panel-body {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: var(--space-2) var(--space-5) max(var(--space-6), var(--safe-bottom))
          max(var(--space-5), var(--safe-left));
      }

      /* Phones held upright: bottom sheet (easy thumb reach). */
      @media (max-width: 39.99rem) and (min-height: 30rem) {
        .panel {
          inset: auto 0 0 0;
          width: 100%;
          height: auto;
          max-height: 88dvh;
          border-right: 0;
          border-top: 1px solid var(--color-border-subtle);
          border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }

        .panel-header {
          padding-top: var(--space-4);
          padding-left: var(--space-5);
        }

        .panel-body {
          padding-left: var(--space-5);
        }

        .panel-inner::before {
          content: '';
          align-self: center;
          width: 2.25rem;
          height: 0.25rem;
          margin-top: var(--space-2);
          border-radius: 999px;
          background: var(--color-border-subtle);
        }
      }

      /* Large screens: compact floating panel under the settings button. */
      @media (min-width: 64rem) and (min-height: 40rem) {
        .panel {
          inset: calc(var(--space-4) + var(--tap-min) + var(--space-2)) auto auto var(--space-4);
          width: 22rem;
          height: auto;
          max-height: calc(100dvh - var(--tap-min) - 3 * var(--space-4));
          border: 1px solid var(--color-border-subtle);
          border-radius: var(--radius-lg);
          box-shadow: 0 12px 32px -12px rgb(0 0 0 / 0.25);
        }

        .panel::backdrop {
          background: transparent; /* canvas stays visible while you adjust it */
        }

        .panel-header {
          padding: var(--space-3) var(--space-3) var(--space-1) var(--space-5);
        }

        .panel-body {
          padding: var(--space-2) var(--space-5) var(--space-5);
        }
      }

      /* Subtle entrance. */
      @media (prefers-reduced-motion: no-preference) {
        .panel[open] {
          animation: slide-in-left 220ms var(--ease);
        }
        .panel[open]::backdrop {
          animation: fade-in 220ms var(--ease);
        }
        @media (max-width: 39.99rem) and (min-height: 30rem) {
          .panel[open] {
            animation-name: slide-up;
          }
        }
        @media (min-width: 64rem) and (min-height: 40rem) {
          .panel[open] {
            animation-name: drop-in;
            animation-duration: 160ms;
          }
        }
      }

      @keyframes slide-in-left {
        from {
          transform: translateX(-100%);
        }
      }
      @keyframes slide-up {
        from {
          transform: translateY(100%);
        }
      }
      @keyframes drop-in {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
      }

      /* ── Appearance settings ─────────────────────────────────────── */
      .section {
        display: flex;
        flex-direction: column;
        gap: var(--space-5);
      }

      .section-heading {
        margin: 0;
        color: var(--color-text-muted);
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      fieldset {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }

      legend {
        margin-bottom: var(--space-2);
        padding: 0;
        font-weight: 600;
      }

      .hint {
        margin: 0;
        color: var(--color-text-muted);
        font-size: 0.875rem;
      }

      .hint:empty {
        /* Stays in the accessibility tree so new notes are announced, but takes no room. */
        margin-top: calc(-1 * var(--space-5));
      }

      fieldset .hint:empty {
        margin-top: calc(-1 * var(--space-2));
      }

      /* Theme mode: segmented control built from native radios. */
      .segmented {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--space-1);
        padding: var(--space-1);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-md);
      }

      .segment {
        position: relative;
        display: grid;
        place-items: center;
        min-height: var(--tap-min);
        border-radius: calc(var(--radius-md) - 4px);
        color: var(--color-text-muted);
        font-weight: 550;
        cursor: pointer;
        transition:
          background-color var(--duration) var(--ease),
          color var(--duration) var(--ease);
      }

      .segment input,
      .swatch input[type='radio'] {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }

      .segment:hover {
        color: var(--color-text);
      }

      .segment:has(input:checked) {
        background: var(--color-accent);
        color: var(--color-on-accent);
      }

      .segment:has(input:focus-visible),
      .swatch:has(input:focus-visible) {
        outline: 3px solid var(--color-accent-strong);
        outline-offset: 2px;
      }

      /* Colour swatches. */
      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 0;
        margin-inline: calc(-1 * var(--space-1));
      }

      .swatch {
        position: relative;
        display: grid;
        place-items: center;
        width: var(--tap-min);
        height: var(--tap-min);
        border-radius: 50%;
        cursor: pointer;
      }

      .dot {
        width: 2rem;
        height: 2rem;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px var(--color-border); /* visible even if it matches the panel */
      }

      .swatch:has(input:checked)::after,
      .swatch[data-selected]::after {
        content: '';
        position: absolute;
        inset: 0;
        border: 2px solid var(--color-text);
        border-radius: 50%;
        pointer-events: none;
      }

      .picker {
        width: 2rem;
        height: 2rem;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: conic-gradient(#ef4444, #f59e0b, #22c55e, #06b6d4, #6366f1, #d946ef, #ef4444);
        cursor: pointer;
        -webkit-appearance: none;
        appearance: none;
      }

      .picker::-webkit-color-swatch-wrapper {
        padding: 3px;
      }
      .picker::-webkit-color-swatch {
        border: 0;
        border-radius: 50%;
      }
      .picker::-moz-color-swatch {
        border: 0;
        border-radius: 50%;
      }

      .picker:focus-visible {
        outline: 3px solid var(--color-accent-strong);
        outline-offset: 7px;
      }

      /* Preview. */
      .preview {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
        padding: var(--space-3) var(--space-4);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-md);
        background: var(--color-bg);
      }

      .preview > div {
        flex: 1 1 10rem;
        min-width: 0;
      }

      .preview-title {
        margin: 0;
        font-weight: 600;
      }

      .preview-text {
        margin: 0;
        color: var(--color-text-muted);
        font-size: 0.875rem;
      }

      .preview-button {
        flex-shrink: 0;
        padding: var(--space-2) var(--space-4);
        border-radius: 999px;
        background: var(--color-accent);
        color: var(--color-on-accent);
        font-size: 0.875rem;
        font-weight: 600;
      }

      .reset {
        align-self: flex-start;
        min-height: var(--tap-min);
        padding: 0 var(--space-4);
        border: 1px solid var(--color-border);
        border-radius: 999px;
        background: transparent;
        color: var(--color-text);
        font-weight: 550;
        cursor: pointer;
      }

      .reset:hover {
        background: var(--color-border-subtle);
      }

      @media (forced-colors: active) {
        .panel {
          border: 1px solid CanvasText;
        }
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <button
        type="button"
        class="settings-button"
        id="menu-button"
        aria-label="Settings"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="menu"
      >
        <svg class="settings-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
          <path d="M10.09 2.18 13.91 2.18 14.13 5.02 15.43 5.55 17.59 3.71 20.29 6.41 18.45 8.57 18.98 9.87 21.82 10.09 21.82 13.91 18.98 14.13 18.45 15.43 20.29 17.59 17.59 20.29 15.43 18.45 14.13 18.98 13.91 21.82 10.09 21.82 9.87 18.98 8.57 18.45 6.41 20.29 3.71 17.59 5.55 15.43 5.02 14.13 2.18 13.91 2.18 10.09 5.02 9.87 5.55 8.57 3.71 6.41 6.41 3.71 8.57 5.55 9.87 5.02Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
        </svg>
      </button>

      <main>
        <section class="game-hero" aria-labelledby="game-hero-title">
          <h1 id="game-hero-title">Choose Your Game</h1>
          <!-- Visual selection controls for this stage: no gameplay or navigation yet. -->
          <ul class="game-list" aria-label="Games">
            <li><button type="button" class="game-option" data-game="truth-or-dare">Truth or Dare</button></li>
            <li><button type="button" class="game-option">Never Have I Ever</button></li>
            <li><button type="button" class="game-option">Who's Most Likely To?</button></li>
            <li><button type="button" class="game-option">Random Picker</button></li>
            <li><button type="button" class="game-option">Dumb Charades</button></li>
            <li><button type="button" class="game-option">Rolling Dice</button></li>
            <li><button type="button" class="game-option">Pick a Card</button></li>
          </ul>
        </section>

        <!-- Truth or Dare screen (UI prototype: no questions or game logic yet). -->
        <section class="tod" id="truth-or-dare" aria-labelledby="tod-title" hidden>
          <button type="button" class="back-button" id="back-button" aria-label="Back to games">
            <svg class="back-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
              <path d="M19 12H5m0 0 6-6m-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>

          <h1 id="tod-title" tabindex="-1">Truth or Dare</h1>

          <div class="flip-cards">
            <button type="button" class="flip-card truth" aria-pressed="false" aria-label="Truth card" data-card="truth">
              <span class="flip-inner">
                <span class="face face-front">
                  <span class="face-word">TRUTH</span>
                  <span class="face-hint">Tap to flip</span>
                </span>
                <span class="face face-back" aria-hidden="true">
                  <span class="face-label">Truth</span>
                  <span class="face-text">Your truth question will appear here.</span>
                </span>
              </span>
            </button>

            <button type="button" class="flip-card dare" aria-pressed="false" aria-label="Dare card" data-card="dare">
              <span class="flip-inner">
                <span class="face face-front">
                  <span class="face-word">DARE</span>
                  <span class="face-hint">Tap to flip</span>
                </span>
                <span class="face face-back" aria-hidden="true">
                  <span class="face-label">Dare</span>
                  <span class="face-text">Your dare will appear here.</span>
                </span>
              </span>
            </button>
          </div>
        </section>
      </main>
    </div>

    <dialog class="panel" id="menu" aria-labelledby="menu-title">
      <div class="panel-inner">
        <header class="panel-header">
          <h2 class="panel-title" id="menu-title">Menu</h2>
          <button type="button" class="icon-button" id="close-button" aria-label="Close menu">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </header>

        <div class="panel-body">
          <section class="section" aria-labelledby="appearance-title">
            <h3 class="section-heading" id="appearance-title">Appearance</h3>

            <fieldset>
              <legend>Theme</legend>
              <div class="segmented" id="mode-group"></div>
              <p class="hint" id="mode-hint"></p>
            </fieldset>

            <fieldset>
              <legend>Background</legend>
              <div class="swatches" id="background-group"></div>
            </fieldset>

            <fieldset>
              <legend>Accent</legend>
              <div class="swatches" id="accent-group"></div>
            </fieldset>

            <div class="preview" role="group" aria-label="Preview">
              <div>
                <p class="preview-title">Preview</p>
                <p class="preview-text">Text stays readable on every colour.</p>
              </div>
              <span class="preview-button">Accent</span>
            </div>

            <p class="hint" id="accent-note" aria-live="polite"></p>

            <button type="button" class="reset" id="reset-button">Reset to default</button>
          </section>
        </div>
      </div>
    </dialog>

    <script>
      'use strict';

      /* ── Colour toolkit ────────────────────────────────────────────
         Users can pick any colour, so every other colour (text, borders,
         focus ring, text on the accent) is derived from the two picks and
         checked against WCAG 2.2 AA. Anything that would be hard to read is
         nudged until it passes. */
      const MIN_TEXT = 4.5;
      const MIN_UI = 3;

      const normalizeHex = (value) => {
        const hex = String(value).trim().replace('#', '').toLowerCase();
        if (!/^([0-9a-f]{3}|[0-9a-f]{6})$/.test(hex)) throw new Error('Not a hex colour: ' + value);
        return '#' + (hex.length === 3 ? [...hex].map((c) => c + c).join('') : hex);
      };
      const toRgb = (hex) => {
        const h = normalizeHex(hex).slice(1);
        return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
      };
      const toHex = (rgb) =>
        '#' + rgb.map((v) => Math.round(Math.min(255, Math.max(0, v))).toString(16).padStart(2, '0')).join('');
      const luminance = (hex) => {
        const [r, g, b] = toRgb(hex).map((v) => {
          const c = v / 255;
          return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
        });
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      };
      const contrast = (a, b) => {
        const [hi, lo] = [luminance(a), luminance(b)].sort((x, y) => y - x);
        return (hi + 0.05) / (lo + 0.05);
      };
      const mix = (from, to, amount) => {
        const a = toRgb(from);
        const b = toRgb(to);
        return toHex(a.map((v, i) => v + (b[i] - v) * amount));
      };
      const ensureContrast = (colour, against, min, toward) => {
        for (let step = 0; step <= 20; step += 1) {
          const candidate = mix(colour, toward, step / 20);
          if (against.every((bg) => contrast(candidate, bg) >= min)) return candidate;
        }
        return normalizeHex(toward);
      };
      const readableOn = (bg) => (contrast(bg, '#ffffff') >= contrast(bg, '#000000') ? '#ffffff' : '#000000');

      function derivePalette(backgroundInput, accentInput) {
        const background = normalizeHex(backgroundInput);
        const accent = normalizeHex(accentInput);
        const scheme = contrast(background, '#ffffff') > contrast(background, '#000000') ? 'dark' : 'light';
        const softText = scheme === 'dark' ? '#f4f4f5' : '#18181b';
        const pureText = scheme === 'dark' ? '#ffffff' : '#000000';
        // Panels sit a touch lighter than the canvas; on mid-tones they match it.
        const lifted = mix(background, '#ffffff', scheme === 'dark' ? 0.06 : 0.6);
        const text = [background, lifted].every((bg) => contrast(softText, bg) >= 7) ? softText : pureText;
        const surface = contrast(text, lifted) >= MIN_TEXT ? lifted : background;
        const surfaces = [background, surface];
        const accentStrong = ensureContrast(accent, surfaces, MIN_UI, text);
        return {
          scheme,
          background,
          surface,
          text,
          textMuted: ensureContrast(mix(text, background, 0.35), surfaces, MIN_TEXT, text),
          border: ensureContrast(mix(background, text, 0.32), surfaces, MIN_UI, text),
          borderSubtle: mix(background, text, 0.12),
          accent,
          onAccent: readableOn(accent),
          accentStrong,
          scrim: scheme === 'dark' ? 'rgb(0 0 0 / 0.6)' : 'rgb(15 15 20 / 0.35)',
          accentAdjusted: accentStrong !== accent,
        };
      }

      /* ── Options ─────────────────────────────────────────────────── */
      const MODES = [
        { id: 'system', label: 'System' },
        { id: 'light', label: 'Light' },
        { id: 'dark', label: 'Dark' },
      ];
      const BACKGROUNDS = [
        { id: 'default', label: 'Default', light: '#fbfbfa', dark: '#121214' },
        { id: 'stone', label: 'Stone', light: '#f3f1ec', dark: '#1c1b19' },
        { id: 'sage', label: 'Sage', light: '#edf3ee', dark: '#111a15' },
        { id: 'ocean', label: 'Ocean', light: '#ecf2f9', dark: '#0e1621' },
        { id: 'rose', label: 'Rose', light: '#f9eef1', dark: '#1d1216' },
        { id: 'lavender', label: 'Lavender', light: '#f1effa', dark: '#15131f' },
      ];
      const ACCENTS = [
        { id: 'violet', label: 'Violet', value: '#6b4eff' },
        { id: 'blue', label: 'Blue', value: '#2563eb' },
        { id: 'teal', label: 'Teal', value: '#0d9488' },
        { id: 'green', label: 'Green', value: '#16a34a' },
        { id: 'amber', label: 'Amber', value: '#f59e0b' },
        { id: 'pink', label: 'Pink', value: '#db2777' },
      ];
      const DEFAULTS = { mode: 'system', background: { preset: 'default' }, accent: { preset: 'violet' } };

      /* ── State (in memory only: no localStorage, no cookies) ─────── */
      let settings = structuredClone(DEFAULTS);
      let palette = null;
      const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');

      const isDark = () => (settings.mode === 'system' ? darkQuery.matches : settings.mode === 'dark');
      const resolveBackground = () => {
        if (settings.background.custom) return settings.background.custom;
        const preset = BACKGROUNDS.find((p) => p.id === settings.background.preset) || BACKGROUNDS[0];
        return isDark() ? preset.dark : preset.light;
      };
      const resolveAccent = () =>
        settings.accent.custom || (ACCENTS.find((p) => p.id === settings.accent.preset) || ACCENTS[0]).value;

      /* ── Apply: write the palette to CSS variables on <html> ─────── */
      function apply() {
        palette = derivePalette(resolveBackground(), resolveAccent());
        const root = document.documentElement;
        const vars = {
          '--color-bg': palette.background,
          '--color-surface': palette.surface,
          '--color-text': palette.text,
          '--color-text-muted': palette.textMuted,
          '--color-border': palette.border,
          '--color-border-subtle': palette.borderSubtle,
          '--color-accent': palette.accent,
          '--color-on-accent': palette.onAccent,
          '--color-accent-strong': palette.accentStrong,
          '--color-scrim': palette.scrim,
        };
        for (const [name, value] of Object.entries(vars)) root.style.setProperty(name, value);
        root.style.colorScheme = palette.scheme;
        root.dataset.theme = palette.scheme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', palette.background);
        syncControls();
      }

      /* ── Build the controls ──────────────────────────────────────── */
      const el = (tag, props = {}, children = []) => {
        const node = Object.assign(document.createElement(tag), props);
        for (const child of children) node.append(child);
        return node;
      };

      const modeGroup = document.getElementById('mode-group');
      for (const mode of MODES) {
        const input = el('input', { type: 'radio', name: 'theme-mode', value: mode.id });
        input.addEventListener('change', () => {
          settings.mode = mode.id;
          apply();
        });
        modeGroup.append(el('label', { className: 'segment' }, [input, el('span', { textContent: mode.label })]));
      }

      function buildSwatchGroup(container, key, presets, legend) {
        const radios = presets.map((preset) => {
          const input = el('input', { type: 'radio', name: key, value: preset.id });
          input.setAttribute('aria-label', preset.label);
          input.addEventListener('change', () => {
            settings[key] = { preset: preset.id };
            apply();
          });
          const dot = el('span', { className: 'dot' });
          dot.setAttribute('aria-hidden', 'true');
          const label = el('label', { className: 'swatch', title: preset.label }, [input, dot]);
          container.append(label);
          return { input, dot, preset };
        });

        const pickerId = key + '-custom';
        const picker = el('input', { type: 'color', id: pickerId, className: 'picker' });
        // `input` fires continuously while dragging in the picker: live preview.
        picker.addEventListener('input', () => {
          settings[key] = { custom: normalizeHex(picker.value) };
          apply();
        });
        const pickerLabel = el('label', {
          htmlFor: pickerId,
          className: 'visually-hidden',
          textContent: 'Custom ' + legend + ' colour',
        });
        const wrapper = el('span', { className: 'swatch' }, [pickerLabel, picker]);
        container.append(wrapper);
        return { radios, picker, wrapper };
      }

      const backgroundControls = buildSwatchGroup(
        document.getElementById('background-group'),
        'background',
        BACKGROUNDS,
        'background',
      );
      const accentControls = buildSwatchGroup(document.getElementById('accent-group'), 'accent', ACCENTS, 'accent');

      function syncSwatches(controls, choice, current) {
        for (const { input, dot, preset } of controls.radios) {
          input.checked = !choice.custom && choice.preset === preset.id;
          dot.style.background = preset.value || (isDark() ? preset.dark : preset.light);
        }
        controls.picker.value = current;
        controls.wrapper.toggleAttribute('data-selected', Boolean(choice.custom));
      }

      function syncControls() {
        for (const input of modeGroup.querySelectorAll('input')) input.checked = input.value === settings.mode;
        syncSwatches(backgroundControls, settings.background, palette.background);
        syncSwatches(accentControls, settings.accent, palette.accent);
        document.getElementById('mode-hint').textContent = settings.background.custom
          ? 'A custom background sets light or dark text by itself.'
          : '';
        document.getElementById('accent-note').textContent = palette.accentAdjusted
          ? 'Accent outlines are adjusted slightly so they stay visible on this background.'
          : '';
      }

      document.getElementById('reset-button').addEventListener('click', () => {
        settings = structuredClone(DEFAULTS);
        apply();
      });

      // Follow the device's light/dark setting live while in System mode.
      darkQuery.addEventListener('change', () => {
        if (settings.mode === 'system') apply();
      });

      /* ── Menu: native modal <dialog> ─────────────────────────────
         showModal() traps focus, makes the page behind inert and handles
         Escape. Clicks on the backdrop (the dialog element itself) close it.
         Focus returns to the settings button when it closes. */
      const menu = document.getElementById('menu');
      const menuButton = document.getElementById('menu-button');

      function openMenu() {
        if (menu.open) return;
        menu.showModal();
        menuButton.setAttribute('aria-expanded', 'true');
      }

      function closeMenu() {
        if (menu.open) menu.close();
      }

      menuButton.addEventListener('click', openMenu);
      document.getElementById('close-button').addEventListener('click', closeMenu);
      menu.addEventListener('click', (event) => {
        if (event.target === menu) closeMenu();
      });
      menu.addEventListener('close', () => {
        menuButton.setAttribute('aria-expanded', 'false');
        menuButton.focus();
      });

      /* ── Screens: game selection ⇄ Truth or Dare ──────────────────
         The URL hash records the screen (#truth-or-dare), so the browser's
         own Back button works too. Works when opened from disk (file://). */
      const selectionView = document.querySelector('.game-hero');
      const todView = document.getElementById('truth-or-dare');
      const todOption = document.querySelector('[data-game="truth-or-dare"]');
      const flipCards = [...document.querySelectorAll('.flip-card')];
      const BASE_TITLE = document.title;

      function setFlipped(card, flipped) {
        card.setAttribute('aria-pressed', String(flipped));
        // Only the visible face is exposed to screen readers.
        card.querySelector('.face-front').setAttribute('aria-hidden', String(flipped));
        card.querySelector('.face-back').setAttribute('aria-hidden', String(!flipped));
      }

      function showScreen(fromNavigation) {
        const onTod = location.hash === '#truth-or-dare';
        selectionView.hidden = onTod;
        todView.hidden = !onTod;
        document.title = onTod ? 'Truth or Dare — ' + BASE_TITLE : BASE_TITLE;
        if (onTod) {
          flipCards.forEach((card) => setFlipped(card, false)); // always start face up
          if (fromNavigation) document.getElementById('tod-title').focus();
        } else if (fromNavigation) {
          todOption.focus();
        }
      }

      todOption.addEventListener('click', () => {
        location.hash = 'truth-or-dare';
      });

      document.getElementById('back-button').addEventListener('click', () => {
        // Return to the selection screen. Prefer stepping back in history so
        // the browser's Back/Forward stay in sync; otherwise clear the hash.
        if (history.state && history.state.fromSelection) history.back();
        else location.hash = '';
      });

      window.addEventListener('hashchange', () => {
        if (location.hash === '#truth-or-dare') history.replaceState({ fromSelection: true }, '');
        showScreen(true);
      });

      // Each card flips on its own, back and forth.
      for (const card of flipCards) {
        card.addEventListener('click', () => setFlipped(card, card.getAttribute('aria-pressed') !== 'true'));
      }

      // The welcome bounce plays once per page load; after the last button
      // finishes, the buttons stay still (also when returning from a game).
      const lastButton = selectionView.querySelector('li:last-child .game-option');
      lastButton.addEventListener('animationend', () => selectionView.setAttribute('data-settled', ''), { once: true });

      // iOS Safari only applies :active (the pressed style) when the page
      // listens for touches; this empty, passive listener enables it.
      document.addEventListener('touchstart', () => {}, { passive: true });

      showScreen(false);
      apply();
    </script>
  </body>
</html>
